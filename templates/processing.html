<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Processing Request</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        /* Header */
        .header {
            background: #2f3e9e;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin-left: 20px;
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Centered content */
        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 100px; /* adjust vertical position */
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        /* Spinner */
        .spinner {
            border: 8px solid #eee;
            border-top: 8px solid #2f3e9e; /* match header color */
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #444;
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-title">Frame Generator</div>
    <nav>
        <a href="/">Home</a>
    </nav>
</header>

<div class="center-content">
    <h2>Your frame request is being processed...</h2>
    <div class="spinner"></div>
    <div class="message">Please wait, generating frames...</div>
</div>

<script>
    const taskId = "{{ task_id }}";

    async function checkStatus() {
        const res = await fetch(`/status/${taskId}`);
        const data = await res.json();

        if (data.status === "completed") {
            window.location.href = `/result/${taskId}`;
        } else {
            setTimeout(checkStatus, 1500);
        }
    }

    checkStatus();
</script>

</body>
</html>
