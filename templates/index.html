<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frame Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        /* Header */
        .header {
            background: #2f3e9e;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin-left: 20px;
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Center Links */
        .center-links {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 150px; /* adjust vertical position */
        }

        .center-links a {
            display: block;
            margin: 15px 0;
            padding: 15px 25px;
            background: #2f3e9e;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            width: 200px;
            text-align: center;
            transition: background 0.3s;
        }

        .center-links a:hover {
            background: #1e2c75;
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-title">Frame Generator</div>
    <nav>
        <a href="/">Home</a>
    </nav>
</header>

<div class="center-links">
    <a href="/new-request">New Request</a>
    <a href="/analytics">Analytics</a>
</div>

</body>
</html>
